apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 5m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: edinstance-lab
  timeout: 5m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
