apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-database
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  path: ./kubernetes/platform/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: edinstance-lab
  timeout: 10m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
