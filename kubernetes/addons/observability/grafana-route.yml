apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-local
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: http-local
    - name: main-gateway
      namespace: gateway-system
      sectionName: https-local
  hostnames:
    - grafana.local.edinstance.uk
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-public
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: http-public
  hostnames:
    - grafana.edinstance.uk
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-stack-grafana
          port: 80
