apiVersion: v1
kind: Secret
metadata:
  name: platform-api-config
  namespace: platform-system
type: Opaque
stringData:
  database-name: app
  database-user: app
  database-password: REPLACE_WITH_DATABASE_PASSWORD
  # Base64-encoded 32 bytes.
  encryption-key: REPLACE_WITH_32_BYTE_KEY
  auth-jwks-url: https://platform.example.com/api/auth/jwks
  auth-issuer: https://platform.example.com
  auth-audience: platform-api
