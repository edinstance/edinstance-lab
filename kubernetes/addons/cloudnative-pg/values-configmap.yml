apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudnative-pg-values
  namespace: flux-system
data:
  values.yml: |
    replicaCount: 2

    monitoring:
      podMonitorEnabled: true

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
