name: platform images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/frontend/**
      - services/platform-api/**
      - .github/workflows/platform-images.yml
      - scripts/update-platform-deployments.sh
  push:
    branches:
      - main
    paths:
      - services/frontend/**
      - services/platform-api/**
      - .github/workflows/platform-images.yml
      - scripts/update-platform-deployments.sh

concurrency:
  group: platform-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  build-push-update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY}/frontend:sha-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: services/frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push platform API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: services/platform-api
          push: true
          tags: ghcr.io/${{ github.repository }}/platform-api:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=platform-api
          cache-to: type=gha,mode=max,scope=platform-api

      - name: Update deployment images
        shell: bash
        run: |
          scripts/update-platform-deployments.sh "${{ steps.meta.outputs.short_sha }}"

      - name: Commit deployment image tags
        shell: bash
        run: |
          files=(
            kubernetes/platform/frontend/deployment.yml
            kubernetes/platform/api/deployment.yml
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Deployments already use sha-${{ steps.meta.outputs.short_sha }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Deploy platform sha-${{ steps.meta.outputs.short_sha }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
