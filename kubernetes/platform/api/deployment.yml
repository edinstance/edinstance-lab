apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: edinstance-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: edinstance-platform
    spec:
      serviceAccountName: platform-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: ghcr.io/edinstance/edinstance-lab/platform-api:sha-a7a07c8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_API_ADDR
              value: :8080
            - name: PLATFORM_RECONCILE_ENABLED
              value: "true"
            - name: PLATFORM_APPS_NAMESPACE
              value: apps
            - name: PLATFORM_GATEWAY_NAMESPACE
              value: gateway-system
            - name: PLATFORM_GATEWAY_NAME
              value: main-gateway
            - name: PLATFORM_GATEWAY_SECTION_NAME
              value: http-local
            - name: OTEL_SERVICE_NAME
              value: platform-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318
            - name: PLATFORM_DATABASE_HOST
              value: platform-db-pooler-rw.platform-db.svc.cluster.local
            - name: PLATFORM_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-name
            - name: PLATFORM_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-user
            - name: PLATFORM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-password
            - name: PLATFORM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: encryption-key
            - name: PLATFORM_AUTH_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: auth-jwks-url
            - name: PLATFORM_AUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: auth-issuer
            - name: PLATFORM_AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: auth-audience
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
