apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: apps
  labels:
    app.kubernetes.io/name: SERVICE_NAME
    app.kubernetes.io/managed-by: edinstance-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE_NAME
        app.kubernetes.io/managed-by: edinstance-platform
    spec:
      serviceAccountName: SERVICE_NAME
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: SERVICE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: SERVICE_PORT
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: SERVICE_NAME
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
