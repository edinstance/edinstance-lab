apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudnative-pg
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudnative-pg.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {"type":"stat","title":"Postgres instances up","id":1,"gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"expr":"sum(cnpg_collector_up{namespace=\"platform-db\"})","refId":"A"}],"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":3}]}}}},
        {"type":"stat","title":"Primary instances","id":2,"gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"expr":"sum(cnpg_pg_replication_is_wal_receiver_up{namespace=\"platform-db\"} == 0)","refId":"A"}]},
        {"type":"stat","title":"Database size","id":3,"gridPos":{"h":4,"w":4,"x":8,"y":0},"targets":[{"expr":"max(cnpg_pg_database_size_bytes{namespace=\"platform-db\",datname=\"app\"})","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"type":"stat","title":"Active connections","id":4,"gridPos":{"h":4,"w":4,"x":12,"y":0},"targets":[{"expr":"sum(cnpg_backends_total{namespace=\"platform-db\",state=\"active\"})","refId":"A"}]},
        {"type":"stat","title":"Oldest transaction","id":5,"gridPos":{"h":4,"w":4,"x":16,"y":0},"targets":[{"expr":"max(cnpg_backends_max_tx_duration_seconds{namespace=\"platform-db\"})","refId":"A"}],"fieldConfig":{"defaults":{"unit":"s"}}},
        {"type":"stat","title":"Pod restarts (24h)","id":6,"gridPos":{"h":4,"w":4,"x":20,"y":0},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"platform-db\"}[24h]))","refId":"A"}]},
        {"type":"timeseries","title":"Replication lag","id":7,"gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"cnpg_pg_replication_lag{namespace=\"platform-db\"}","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"s"}}},
        {"type":"timeseries","title":"Connections by state","id":8,"gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"expr":"sum by (state) (cnpg_backends_total{namespace=\"platform-db\"})","legendFormat":"{{state}}","refId":"A"}]},
        {"type":"timeseries","title":"Transaction rate","id":9,"gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"expr":"sum by (pod) (rate(cnpg_pg_stat_database_xact_commit{namespace=\"platform-db\",datname=\"app\"}[5m]))","legendFormat":"commits {{pod}}","refId":"A"},{"expr":"sum by (pod) (rate(cnpg_pg_stat_database_xact_rollback{namespace=\"platform-db\",datname=\"app\"}[5m]))","legendFormat":"rollbacks {{pod}}","refId":"B"}]},
        {"type":"timeseries","title":"Postgres pod CPU","id":10,"gridPos":{"h":8,"w":12,"x":12,"y":12},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"platform-db\",container=\"postgres\"}[5m]))","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"cores"}}},
        {"type":"timeseries","title":"Postgres pod memory","id":11,"gridPos":{"h":8,"w":12,"x":0,"y":20},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"platform-db\",container=\"postgres\"})","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"type":"timeseries","title":"Pooler clients","id":12,"gridPos":{"h":8,"w":12,"x":12,"y":20},"targets":[{"expr":"sum by (pod, state) (cnpg_pgbouncer_clients{namespace=\"platform-db\"})","legendFormat":"{{pod}} {{state}}","refId":"A"}]}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["postgres", "cloudnative-pg", "platform"],
      "templating": {"list": []},
      "time": {"from":"now-6h","to":"now"},
      "timezone": "browser",
      "title": "Platform / PostgreSQL",
      "uid": "platform-postgresql",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-api
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-api.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {"type":"stat","title":"Available replicas","id":1,"gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"expr":"kube_deployment_status_replicas_available{namespace=\"platform-system\",deployment=\"platform-api\"}","refId":"A"}],"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":1},{"color":"green","value":2}]}}}},
        {"type":"stat","title":"Pending reconciliations","id":2,"gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"expr":"max(platform_reconciliation_pending{service_name=\"platform-api\"})","refId":"A"}]},
        {"type":"stat","title":"Divergent services","id":3,"gridPos":{"h":4,"w":4,"x":8,"y":0},"targets":[{"expr":"max(platform_reconciliation_divergent{service_name=\"platform-api\"})","refId":"A"}]},
        {"type":"stat","title":"Reconciliation failure rate","id":4,"gridPos":{"h":4,"w":4,"x":12,"y":0},"targets":[{"expr":"sum(rate(platform_reconciliation_failures_total{service_name=\"platform-api\"}[5m])) / clamp_min(sum(rate(platform_reconciliation_attempts_total{service_name=\"platform-api\"}[5m])), 0.000001)","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percentunit"}}},
        {"type":"stat","title":"Pod restarts (24h)","id":5,"gridPos":{"h":4,"w":4,"x":16,"y":0},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"platform-system\",container=\"platform-api\"}[24h]))","refId":"A"}]},
        {"type":"stat","title":"Ready pods","id":6,"gridPos":{"h":4,"w":4,"x":20,"y":0},"targets":[{"expr":"sum(kube_pod_status_ready{namespace=\"platform-system\",condition=\"true\",pod=~\"platform-api-.*\"})","refId":"A"}]},
        {"type":"timeseries","title":"Reconciliation throughput","id":7,"gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"sum by (operation) (rate(platform_reconciliation_attempts_total{service_name=\"platform-api\"}[5m]))","legendFormat":"attempts {{operation}}","refId":"A"},{"expr":"sum by (operation) (rate(platform_reconciliation_failures_total{service_name=\"platform-api\"}[5m]))","legendFormat":"failures {{operation}}","refId":"B"}],"fieldConfig":{"defaults":{"unit":"ops"}}},
        {"type":"timeseries","title":"Reconciliation backlog","id":8,"gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"expr":"max(platform_reconciliation_pending{service_name=\"platform-api\"})","legendFormat":"pending","refId":"A"},{"expr":"max(platform_reconciliation_divergent{service_name=\"platform-api\"})","legendFormat":"divergent","refId":"B"}]},
        {"type":"timeseries","title":"API CPU","id":9,"gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"platform-system\",container=\"platform-api\"}[5m]))","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"cores"}}},
        {"type":"timeseries","title":"API memory","id":10,"gridPos":{"h":8,"w":12,"x":12,"y":12},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"platform-system\",container=\"platform-api\"})","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"type":"timeseries","title":"Replica availability","id":11,"gridPos":{"h":8,"w":12,"x":0,"y":20},"targets":[{"expr":"kube_deployment_status_replicas_available{namespace=\"platform-system\",deployment=\"platform-api\"}","legendFormat":"available","refId":"A"},{"expr":"kube_deployment_spec_replicas{namespace=\"platform-system\",deployment=\"platform-api\"}","legendFormat":"desired","refId":"B"}]},
        {"type":"timeseries","title":"Container restarts","id":12,"gridPos":{"h":8,"w":12,"x":12,"y":20},"targets":[{"expr":"sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"platform-system\",container=\"platform-api\"}[15m]))","legendFormat":"{{pod}}","refId":"A"}]}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["api", "opentelemetry", "platform"],
      "templating": {"list": []},
      "time": {"from":"now-6h","to":"now"},
      "timezone": "browser",
      "title": "Platform / API",
      "uid": "platform-api",
      "version": 1
    }
