---
- name: Install kube-vip bootstrap static pod manifest
  hosts: k8s_control_plane
  become: true

  tasks:
    - name: Refuse to run on non-bootstrap control-plane nodes
      ansible.builtin.assert:
        that:
          - inventory_hostname == (first_control_plane | default(groups['k8s_control_plane'][0]))
        fail_msg: >-
          This bootstrap playbook is only for the first control-plane node before
          kubeadm init. Run 03-kube-vip.yml after other control-plane nodes join.

    - name: Check whether Kubernetes admin.conf exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kube_admin_conf

    - name: Refuse if admin.conf already exists as a directory
      ansible.builtin.assert:
        that:
          - not kube_admin_conf.stat.exists or kube_admin_conf.stat.isreg
        fail_msg: >-
          /etc/kubernetes/admin.conf exists but is not a regular file. Remove
          it before bootstrapping so kubeadm can create the real admin.conf.

    - name: Create Kubernetes static pod manifest directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: "0755"

    - name: Reload systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure containerd is running
      ansible.builtin.systemd_service:
        name: containerd
        state: started

    - name: Wait for containerd socket
      ansible.builtin.wait_for:
        path: /run/containerd/containerd.sock
        state: present
        timeout: 30

    - name: Pull kube-vip image into containerd Kubernetes namespace
      ansible.builtin.command:
        cmd: >-
          ctr --namespace k8s.io image pull
          ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      changed_when: false
      register: kube_vip_pull
      retries: 3
      delay: 5
      until: kube_vip_pull.rc == 0

    - name: Ensure a default IPv4 interface was detected
      ansible.builtin.assert:
        that:
          - ansible_facts.default_ipv4 is defined
          - ansible_facts.default_ipv4.interface is defined
        fail_msg: >-
          No default IPv4 route/interface was found on this host, so the
          kube-vip interface cannot be determined. Configure a default route
          or set kube_vip_interface explicitly before running this playbook.
      when: kube_vip_interface is not defined

    - name: Detect default network interface
      ansible.builtin.set_fact:
        kube_vip_interface: "{{ ansible_facts.default_ipv4.interface }}"
      when: kube_vip_interface is not defined

    - name: Generate kube-vip bootstrap static pod manifest
      ansible.builtin.shell: |
        set -euo pipefail
        tmp_manifest="$(mktemp)"
        ctr --namespace k8s.io run --rm --net-host \
          ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip \
          /kube-vip manifest pod \
          --interface "{{ kube_vip_interface }}" \
          --address "{{ k8s_api_vip }}" \
          --controlplane \
          --arp \
          --leaderElection \
          > "$tmp_manifest"

        if [ ! -s "$tmp_manifest" ]; then
          rm -f "$tmp_manifest"
          echo "kube-vip manifest generation produced an empty file" >&2
          exit 1
        fi

        if grep -q "path: /etc/kubernetes/admin.conf" "$tmp_manifest" &&
          ! grep -q "type: File" "$tmp_manifest"; then
          sed -i "/path: \\/etc\\/kubernetes\\/admin.conf/a\\          type: File" "$tmp_manifest"
        fi

        mv "$tmp_manifest" /etc/kubernetes/manifests/kube-vip.yaml
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/manifests/kube-vip.yaml
