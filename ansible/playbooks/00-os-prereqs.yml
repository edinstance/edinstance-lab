---
- name: Configure OS prerequisites for Kubernetes
  hosts: k8s_nodes
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a

  tasks:
    - name: Disable unmanaged desktop apt sources
      ansible.builtin.command:
        cmd: "mv {{ item }} {{ item }}.disabled"
        removes: "{{ item }}"
        creates: "{{ item }}.disabled"
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/flatpak-ubuntu-stable-noble.sources
        - /etc/apt/sources.list.d/google-chrome.list

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300

    - name: Install Kubernetes and Longhorn host prerequisites
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
          - util-linux
        state: present
        lock_timeout: 300

    - name: Ensure open-iscsi is enabled and running
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist
        lock_timeout: 300
      when: os_prereqs_upgrade_packages | default(false) | bool

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load overlay module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Ensure time sync is enabled
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false

    - name: Disable sleep target
      ansible.builtin.systemd:
        name: sleep.target
        masked: true

    - name: Disable suspend target
      ansible.builtin.systemd:
        name: suspend.target
        masked: true

    - name: Disable hibernate target
      ansible.builtin.systemd:
        name: hibernate.target
        masked: true

    - name: Disable hybrid sleep target
      ansible.builtin.systemd:
        name: hybrid-sleep.target
        masked: true
