apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.157.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  targetNamespace: opentelemetry
  valuesFrom:
    - kind: ConfigMap
      name: opentelemetry-collector-values
      valuesKey: values.yml
