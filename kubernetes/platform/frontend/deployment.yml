apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-frontend
    app.kubernetes.io/part-of: edinstance-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-frontend
        app.kubernetes.io/part-of: edinstance-platform
    spec:
      serviceAccountName: platform-frontend
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: platform-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/edinstance/edinstance-lab/frontend:sha-126da57
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BETTER_AUTH_URL
              value: https://ui.edinstance.uk
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: https://ui.edinstance.uk,https://ui.local.edinstance.uk
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: auth-secret
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: admin-password
            - name: PLATFORM_AUTH_ISSUER
              value: https://ui.edinstance.uk
            - name: PLATFORM_AUTH_AUDIENCE
              value: platform-api
            - name: PLATFORM_DATABASE_HOST
              value: platform-db-pooler-rw.platform-db.svc.cluster.local
            - name: PLATFORM_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-name
            - name: PLATFORM_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-user
            - name: PLATFORM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-password
            - name: OTEL_SERVICE_NAME
              value: platform-frontend
            - name: OTEL_SERVICE_VERSION
              value: sha-126da57
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.2"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=homelab
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
