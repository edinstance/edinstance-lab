apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-values
  namespace: flux-system
data:
  values.yml: |
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        retention_period: 168h
        max_query_series: 5000
        max_entries_limit_per_query: 5000
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      query_scheduler:
        max_outstanding_requests_per_tenant: 1024
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    gateway:
      enabled: true
      service:
        type: ClusterIP
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    minio:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
