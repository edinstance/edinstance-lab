apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-values
  namespace: flux-system
data:
  values.yml: |
    fullnameOverride: opentelemetry-collector

    mode: deployment
    replicaCount: 1

    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.128.0"

    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      prometheus:
        enabled: true
        containerPort: 9464
        servicePort: 9464
        protocol: TCP

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.node.name
              - k8s.container.name
        resource:
          attributes:
            - key: k8s.cluster.name
              value: homelab
              action: upsert
        batch: {}
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15
      exporters:
        debug: null
        prometheus:
          endpoint: 0.0.0.0:9464
        otlp/tempo:
          endpoint: monitoring-tempo.monitoring.svc.cluster.local:4317
          tls:
            insecure: true
      service:
        extensions:
          - health_check
        telemetry:
          metrics:
            level: detailed
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
        pipelines:
          logs: null
          traces:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - k8sattributes
              - resource
              - batch
            exporters:
              - otlp/tempo
          metrics:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - k8sattributes
              - resource
              - batch
            exporters:
              - prometheus
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
