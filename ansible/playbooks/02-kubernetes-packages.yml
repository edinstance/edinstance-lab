---
- name: Install Kubernetes packages
  hosts: k8s_nodes
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes apt key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_minor }}/deb/Release.key \
          | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring-v{{ kubernetes_version_minor }}.gpg
      changed_when: false

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring-v{{ kubernetes_version_minor }}.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_minor }}/deb/ /

    - name: Install kubelet kubeadm kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_deb_version }}"
          - "kubeadm={{ kubernetes_deb_version }}"
          - "kubectl={{ kubernetes_deb_version }}"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
