apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-frontend
    app.kubernetes.io/part-of: edinstance-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-frontend
        app.kubernetes.io/part-of: edinstance-platform
    spec:
      serviceAccountName: platform-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/edinstance/edinstance-lab/frontend:sha-f5016c4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BETTER_AUTH_URL
              value: https://ui.edinstance.uk
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: auth-secret
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: admin-password
            - name: PLATFORM_AUTH_ISSUER
              value: https://ui.edinstance.uk
            - name: PLATFORM_AUTH_AUDIENCE
              value: platform-api
            - name: PLATFORM_DATABASE_HOST
              value: platform-db-pooler-rw.platform-db.svc.cluster.local
            - name: PLATFORM_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-name
            - name: PLATFORM_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-user
            - name: PLATFORM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-config
                  key: database-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
