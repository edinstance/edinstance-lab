apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-edinstance-uk-wildcard
  namespace: gateway-system
  annotations:
    edinstance.com/note: "Certificate lives with the LAN-only Envoy Gateway resources in gateway-system."
    edinstance.com/tls-guidance: "Uses the staging issuer during rehearsals; see tls.md before switching to production."
spec:
  secretName: local-edinstance-uk-wildcard-tls
  issuerRef:
    name: letsencrypt-staging-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - local.edinstance.uk
    - "*.local.edinstance.uk"
