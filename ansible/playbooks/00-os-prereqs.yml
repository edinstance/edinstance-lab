---
- name: Configure OS prerequisites for Kubernetes
  hosts: k8s_nodes
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load overlay module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Ensure time sync is enabled
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false

    - name: Disable sleep target
      ansible.builtin.systemd:
        name: sleep.target
        masked: true

    - name: Disable suspend target
      ansible.builtin.systemd:
        name: suspend.target
        masked: true

    - name: Disable hibernate target
      ansible.builtin.systemd:
        name: hibernate.target
        masked: true

    - name: Disable hybrid sleep target
      ansible.builtin.systemd:
        name: hybrid-sleep.target
        masked: true
